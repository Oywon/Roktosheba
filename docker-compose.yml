version: '3.9'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roktosheba
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/roktosheba
      JWT_SECRET: change-this-secret
      OTP_CODE_TTL_SECONDS: '900'
      PORT: '4000'
      DB_HOST: db
      DB_PORT: '5432'
    command: ['sh', '-c', './docker-entrypoint.sh']

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '4173:4173'
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api

volumes:
  db_data:
